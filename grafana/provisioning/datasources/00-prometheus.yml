apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      queryTimeout: 60s
      # Performance optimization
      httpMethod: POST
      # Enable Prometheus query caching
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m
      # Disable Exemplars if not needed (reduces query load)
      exemplarTraceIdDestinations: []
    version: 1
